name: Go CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Cool Check
        run: go run ./cmd/cool check
      - name: Guard Tests
        run: go test ./cool/codegen/module -run 'Guard|Layout|GeneratedWiring|MainApplicationDependencies' -count=1
      - name: Unit Tests
        run: go test ./... -count=1
      - name: Race Detection
        run: go test -race ./cool/app ./cool/registry ./cool/module ./modules/... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /dev/null .