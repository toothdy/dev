cool: # Cool 应用配置
  eps: false # 是否暴露实体与接口元数据，线上建议关闭
  initDB: false # 是否自动导入模块数据库种子
  initMenu: false # 是否自动导入模块菜单种子

  crud: # CRUD 配置
    softDelete: true # 是否启用回收站软删除
  auth: # 认证配置
    bcrypt: # 密码摘要配置
      cost: 12 # bcrypt 计算成本，生产环境建议使用 12 或更高
    jwt: # JWT 配置
      currentKeyId: primary # 当前签发密钥 ID
      keys: # JWT 签名密钥集合
        primary: ${COOL_AUTH_JWT_SECRET} # 从环境变量读取签名密钥
    session: # 登录会话配置
      type: memory # 会话存储类型，可选 memory 或 redis
  outbox: # 可靠消息配置
    enabled: false # 是否启用事务消息 Outbox、Inbox 与可靠投递
  transports: # 服务传输配置
    http: # HTTP 服务配置
      enabled: true # 是否启用 HTTP Transport
      address: 0.0.0.0 # HTTP 监听地址
      port: 8001 # HTTP 监听端口
    grpc: # gRPC 服务配置
      enabled: false # 是否启用 gRPC Transport

logger: # GoFrame 系统运行日志配置
  path: logs # 日志文件目录
  file: "{Y-m-d}.log" # 按日期生成日志文件
  level: all # 日志级别
  stdout: true # 是否同时输出到终端
