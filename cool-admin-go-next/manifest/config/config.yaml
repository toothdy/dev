cool: # Cool 应用配置
  auth:
    bcrypt:
      cost: 12
    jwt:
      issuer: cool-admin-go-next
      audience: cool-admin
      currentKeyId: primary
      accessTTL: 2h
      refreshTTL: 360h
      clockSkew: 30s
      keys:
        primary: ${COOL_AUTH_JWT_SECRET}
    session:
      type: memory
  outbox:
    enabled: false # 是否启用事务消息 Outbox、Inbox 与可靠投递
    databaseGroup: default # 使用的 Framework Database Group，需与数据库配置中的组名一致
    pollInterval: 500ms # 发布 Worker 的轮询间隔
    batchSize: 100 # 每轮最多领取的待发布消息数
    leaseDuration: 30s # 单条消息的 Lease 持有时长
    publishTimeout: 10s # 单次发布操作的超时时间，必须小于 Lease 时长
    publishMaxAttempts: 12 # 单条消息允许的最大发布次数
    publishRetryBase: 1s # 发布失败后的首次重试等待时间
    publishRetryMax: 5m # 发布重试等待时间上限
    consumerTimeout: 30s # 单次消费操作的超时时间
    consumerMaxAttempts: 12 # 单条消息允许的最大消费次数
    consumerRetryBase: 1s # 消费失败后的首次重试等待时间
    consumerRetryMax: 5m # 消费重试等待时间上限
    retention: 168h # 已完成消息的保留时间
    maxPayloadBytes: 1048576 # 单条消息载荷的最大字节数
    maxHeaderBytes: 16384 # 消息 Header 的最大字节数
  transports:
    http:
      enabled: true # 是否启用 HTTP Transport
      address: 0.0.0.0 # HTTP 监听地址
      port: 8001 # HTTP 监听端口
      startTimeout: 5s # HTTP 启动等待时间
    grpc:
      enabled: false # 是否启用 gRPC Transport
      address: 0.0.0.0 # gRPC 监听地址
      port: 8002 # gRPC 监听端口
      name: cool # 服务发现使用的服务名称
      registry: false # 是否注册到服务发现
