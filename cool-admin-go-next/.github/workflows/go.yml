name: Go Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: go-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.4
          cache: true
      - run: make check

  race:
    name: Race Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.4
          cache: true
      - run: make test-race

  database:
    name: Database Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.4
          cache: true
      - run: make test-integration

  compatibility:
    name: Compatibility (${{ matrix.name }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            mysql: mysql:8.0.36
            postgres: postgres:9.5.25
          - name: approved
            mysql: mysql:8.4.0
            postgres: postgres:16.3
    env:
      COOL_TEST_MYSQL_IMAGE: ${{ matrix.mysql }}
      COOL_TEST_POSTGRES_IMAGE: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.4
          cache: true
      - run: make test-integration

